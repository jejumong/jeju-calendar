  --display:"Gowun Batang", "Nanum Myeongjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191b; --surface:#202326; --fg:#ecebe6; --muted:#9a9ea1; --line:#33373b; --basalt:#c9c7c0;
  --fest:#f08a45; --fest-soft:#3d2a1d; --view:#7cb866; --view-soft:#243321;
  --food:#4fb0d0; --food-soft:#1b313a; --tip:#ad8fd8; --tip-soft:#2e2639; --spot:#e17b95; --spot-soft:#3a2229; --today:#f08a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191b; --surface:#202326; --fg:#ecebe6; --muted:#9a9ea1; --line:#33373b; --basalt:#c9c7c0;
  --fest:#f08a45; --fest-soft:#3d2a1d; --view:#7cb866; --view-soft:#243321;
  --food:#4fb0d0; --food-soft:#1b313a; --tip:#ad8fd8; --tip-soft:#2e2639; --spot:#e17b95; --spot-soft:#3a2229; --today:#f08a45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.months{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;min-width:0}
.months button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:6px 11px;border-radius:999px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--basalt);color:var(--bg);border-color:var(--basalt)}
.year{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--fest);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.monthhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.monthhead h2{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0}
.monthhead span{color:var(--muted)}
.navbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.grid-scroll{overflow-x:auto}
.calwrap{position:relative;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 10px)}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);min-width:340px}
.dow{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
.dow.sun,.cell.sun .num{color:#c8453b}
.dow.sat,.cell.sat .num{color:var(--food)}
.cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border-top:0;border-left:0;font:inherit;color:inherit;text-align:left;min-width:0}
.cell.blank{cursor:default;background:var(--bg)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--basalt)}
.num{font-size:13px;font-variant-numeric:tabular-nums;padding-left:3px}
.cell.today .num{background:var(--today);color:#fff;border-radius:999px;padding:0 7px;align-self:flex-start}
.pill{font-size:11.5px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:3px}
.dots i{width:6px;height:6px;border-radius:50%}
.c-fest{background:var(--fest-soft);color:var(--fest)} .d-fest{background:var(--fest)}
.c-view{background:var(--view-soft);color:var(--view)} .d-view{background:var(--view)}
.c-food{background:var(--food-soft);color:var(--food)} .d-food{background:var(--food)}
.c-tip{background:var(--tip-soft);color:var(--tip)} .d-tip{background:var(--tip)}
.c-spot{background:var(--spot-soft);color:var(--spot)} .d-spot{background:var(--spot)}
.best{font-size:13.5px;background:var(--spot-soft);color:var(--fg);border-radius:6px;padding:7px 10px}
.best b{color:var(--spot);font-weight:600;margin-right:4px}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{gap:18px;padding-block:20px 48px}
  header p{font-size:15px}
  .pill,.more{display:none}
  .dots{display:flex;gap:4px;padding-left:2px}
  .dots i{width:8px;height:8px}
  .cell{min-height:56px;padding:6px 3px;align-items:center}
  .num{font-size:16px;padding-left:0}
  .cell.today .num{padding:0 8px}
  .dow{font-size:13px;text-align:center;padding:8px 2px}
  .grid{min-width:0}
  .bar{flex-direction:column;align-items:stretch}
  .months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow:visible}
  .months button{font-size:15px;padding:10px 0;min-height:44px}
  .year{justify-content:flex-end}
  .chip{font-size:15px;padding:9px 15px}
  .chip i{width:11px;height:11px}
  .navbtn{width:44px;height:44px;font-size:20px}
  .monthhead{gap:10px}
  .monthhead span{flex-basis:100%;font-size:15px}
  .listhead h3{font-size:18px}
  .allbtn{font-size:16px;padding:0 16px;min-height:48px}
  .list{grid-template-columns:1fr}
  .item{padding:16px}
  .item h4{font-size:18px}
  .item p{font-size:15.5px}
  .best{font-size:15px;padding:10px 12px}
  .place,.when{font-size:14px}
  .tag{font-size:13px;padding:3px 10px}
  footer{font-size:14px}
}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.listhead h3{font-family:var(--display);font-size:21px;margin:0;min-width:0;line-height:1.3;word-break:keep-all}
.listhead h3 small{font-family:var(--body);font-size:.72em;font-weight:500;color:var(--muted);margin-left:6px;white-space:nowrap}
.allbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--fest);background:var(--fest);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px color-mix(in srgb,var(--fest) 35%,transparent)}
.allbtn:active{transform:scale(.97)}
.allbtn[aria-pressed="true"]{background:var(--surface);color:var(--muted);border-color:var(--line);box-shadow:none;font-weight:500}
.dayhint{font-size:13.5px;color:var(--muted);margin:0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item h4{margin:0;font-size:16.5px;font-weight:600}
.item p{margin:0;font-size:14px;color:var(--fg)}
.place{font-size:13px;color:var(--muted)}
.badge{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px;align-self:flex-start}
.badge.ok{border-style:solid;color:var(--view);border-color:var(--view)}
.empty{color:var(--muted);padding:12px 0}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:72ch}
@media (prefers-reduced-motion:no-preference){.cell,.chip,.months button{transition:background .15s,opacity .15s}}
</style>

<div class="wrap">

<script>
const CATS={spot:"명소 적기",fest:"축제·행사",view:"풍경·꽃",food:"제철 먹거리",tip:"여행 팁"};
// [시작월,시작일,끝월,끝일,분류,제목,설명,장소,확정연도(없으면 해마다),즐기는 요령]
const E=[
 [5,20,6,20,"spot","비자림 숲 산책","천년 비자나무 숲이 연둣빛 새잎으로 가장 싱그러운 때. 숲 향기를 내뿜는 피톤치드는 기온이 오르는 초여름부터 여름에 많아지고, 장마 전이라 길도 보송해요.","구좌읍 평대리 비자림",null,"문 여는 아침에 들어가면 사람이 적고 숲 공기가 가장 맑아요. 비 그친 다음 날 아침은 흙과 나무 향이 훨씬 진합니다."],
 [6,19,6,23,"spot","사려니숲 에코힐링 · 물찻오름 개방","평소 닫혀 있는 분화구 습지 물찻오름을 이 기간에만 해설사와 걸을 수 있어요. 출입이 막혀 있던 시험림 길도 함께 열려요.","제주시 교래리 사려니숲길 (붉은오름 입구)","2026","물찻오름 탐방은 하루 150명 선착순 예약제예요. 2026년에는 6월 10일부터 접수했으니, 매년 6월 초 공지를 챙겨 보세요."],
 [1,5,2,10,"spot","사려니숲 설경","눈 내린 다음 날, 곧게 뻗은 삼나무 숲길이 하얗게 덮여 전혀 다른 숲이 돼요.","사려니숲길 (붉은오름·비자림로 입구)",null,"한라산 입산이 부담스러울 때 눈 숲을 걷기 좋은 대안이에요. 눈 온 날은 516도로·비자림로 통제 여부를 먼저 확인하세요."],
 [4,25,5,15,"spot","한라산 털진달래","산철쭉보다 한 달쯤 먼저, 해발 1400~1600m 고원을 분홍빛으로 물들여요. 잎보다 꽃이 먼저 피는 게 특징.","한라산 진달래밭, 선작지왓, 윗세오름",null,"영실 코스로 윗세오름까지 오르면 가장 쉽게 볼 수 있어요. 개화가 늦은 해는 5월 중하순까지 밀려요."],
 [4,24,4,25,"fest","우도 소라축제","우도 특산 뿔소라 요리와 해녀 공연, ‘우도의 밤’ 공연이 열려요.","우도 천진항 일원","2026"],
 [4,28,5,10,"spot","귤꽃 향기 드라이브","하얀 귤꽃이 피면 서귀포 귤밭 마을 전체에 달콤한 향이 퍼져요. 사진보다 창문을 내리고 지나가야 아는 제주예요.","효돈·남원·위미 귤밭 마을길",null,"해 질 무렵 바람이 잦아들 때 향이 가장 짙게 남아요."],
 [5,10,8,31,"spot","은하수 보기","5월에는 새벽, 한여름에는 밤 9~11시쯤 은하수 중심부가 남쪽 하늘에 떠요.","1100고지 습지, 수월봉, 동쪽 해안 마을",null,"달이 없는 그믐 전후, 맑은 날을 고르세요. 휴대폰은 야간 모드로 삼각대에 세워 30초 이상 찍으면 담겨요."],
 [3,15,5,20,"spot","광치기해변 초록 이끼 바위","썰물 때 드러나는 현무암 바위에 초록 이끼가 덮여, 성산일출봉을 배경으로 이국적인 풍경이 펼쳐져요.","성산읍 광치기해변",null,"물이 가장 많이 빠지는 간조 시각에 맞춰 가야 해요. 물때표를 먼저 확인하세요. 바위가 미끄러우니 운동화 필수."],
 [11,1,2,28,"spot","하도리 철새도래지","겨울이면 수천 마리 겨울 철새가 하도 바닷가 호수에 내려앉아요. 운이 좋으면 저어새도 만나요.","구좌읍 하도리 철새도래지",null,"아침 이른 시간이 가장 활발해요. 가까이 다가가지 말고 탐조대에서 쌍안경으로 보세요."],
 [6,1,8,31,"tip","해산물 금어기 확인","여름에는 소라(6/1~8/31), 갈치(7월), 옥돔(7/21~8/20), 참문어(5/16~6/30) 등 금어기가 겹쳐요. 이 기간엔 바다에서 직접 잡지 말고 식당·시장에서 사 드세요.","제주 연안",null,"금어기 날짜는 해마다 고시가 바뀔 수 있어요."],
 [12,31,1,1,"fest","성산일출축제","한 해의 마지막 해넘이와 새해 첫 해돋이를 성산일출봉에서 맞는 행사. 새벽 등반객이 많으니 일찍 출발하세요.","서귀포 성산읍 성산일출봉"],
 [12,10,2,28,"view","한라산 눈꽃·상고대","눈 덮인 영실·윗세오름 길이 가장 아름다운 때. 아이젠은 필수이고, 성판악·관음사 코스는 탐방 예약이 필요해요.","한라산 영실·어리목·윗세오름"],
 [12,1,2,28,"view","동백꽃","붉은 동백이 숲과 돌담을 덮는 계절. 떨어진 꽃잎이 길을 덮는 1월 중순 무렵이 특히 예뻐요.","위미 동백군락지, 카멜리아힐, 남원 동백포레스트"],
 [12,20,2,10,"view","수선화","겨울 들판과 돌담 밑에 하얀 제주 수선화가 피어요. 향이 진해서 걷기만 해도 좋습니다.","대정 추사관 일대, 한림공원"],
 [11,15,2,28,"food","대방어 제철","살이 오른 겨울 대방어 회를 맛볼 때. 모슬포 포구 식당에서 부위별로 즐길 수 있어요.","대정읍 모슬포항 일대"],
 [12,1,3,31,"food","한라봉·천혜향","만감류가 차례로 나오는 시기. 오일장이나 농가 직판장에서 사면 저렴해요.","서귀포 일대 농가, 제주민속오일시장"],
 [1,6,2,10,"tip","숙박 비수기(설 연휴 제외)","방학 성수기가 지나고 1월 중순부터 2월 초까지 펜션·호텔 요금이 내려가는 편이에요. 설 연휴는 예외.","제주 전역"],
 [2,2,2,4,"fest","탐라국 입춘굿","탐라 시대부터 이어 온 봄맞이 굿. 나무 소 ‘낭쉐’를 끄는 낭쉐몰이와 거리굿이 볼거리예요.","제주시 관덕정·제주목 관아","2026"],
 [2,1,3,10,"view","매화","제주의 첫 봄꽃. 흰 매화와 홍매화가 함께 피어요.","휴애리 자연생활공원, 한림공원"],

 [3,28,3,29,"fest","서귀포 유채꽃 국제걷기대회","노란 유채꽃길을 따라 걷는 봄 걷기 행사.","서귀포 표선면 가시리 일대","2026"],
 [3,22,4,8,"view","왕벚꽃","제주 자생 왕벚나무 꽃길. 밤 조명 아래 벚꽃 터널도 인기예요.","전농로, 제주대 입구, 애월 장전리"],
 [3,20,4,15,"view","녹산로 유채·벚꽃길","노란 유채와 분홍 벚꽃이 10km 넘게 함께 이어지는 드라이브 길.","표선면 가시리 녹산로"],
 [4,4,4,5,"fest","서귀포유채꽃축제","드넓은 유채꽃밭 산책과 야간 개장, 공연, 체험 프로그램.","표선면 가시리 조랑말체험공원","2026"],

 [7,24,7,26,"fest","이호테우축제","전통 뗏목 ‘테우’를 테마로 한 여름 해변 축제. 날짜는 해마다 달라요.","제주시 이호테우해변"],
 [8,1,8,1,"fest","풋귤 페스티벌","덜 익은 풋귤로 풋귤청을 담그는 체험과 직거래 장터.","서귀포농업기술센터","2026"],
 [8,1,8,31,"view","해바라기","한여름 들판을 채우는 해바라기밭.","한림 일대 해바라기 농장"],
 [8,25,11,15,"fest","제주비엔날레","제주 동·서부 여러 전시장에서 열리는 현대미술 축제.","제주도립미술관 등 도내 전시장","2026"],
 [9,19,9,20,"fest","제주해녀축제","해녀굿, 거리행진, 해녀 이야기를 듣는 불턱토크쇼와 물질 체험.","구좌읍 제주해녀박물관 일대","2026"],
 [9,20,10,31,"view","핑크뮬리","분홍빛 핑크뮬리 들판. 휴애리에서는 9월 하순부터 핑크뮬리축제를 열어요.","남원 휴애리 자연생활공원"],
 [9,15,10,19,"view","가을 메밀꽃","가을 하늘 아래 흰 메밀꽃밭.","오라동 메밀밭"],
 [9,1,11,30,"food","은갈치 제철","살이 두툼한 가을 은갈치. 갈치조림·갈치국을 맛보세요.","서귀포항, 한림항 일대"],
 [9,1,9,20,"tip","초가을 한산기(추석 연휴 제외)","여름 성수기가 끝나 숙박 요금이 내려가고 바다도 아직 따뜻해요.","제주 전역"],
 [10,3,10,18,"fest","세계유산축전 제주 화산섬과 용암동굴","평소 닫혀 있는 용암동굴과 화산 지형을 걸어 볼 수 있는 기회. 프로그램은 예약 필수.","거문오름·만장굴 등 세계자연유산 일대","2026"],
 [10,17,10,21,"fest","탐라문화제","제주 대표 역사문화 축제. 거리 퍼레이드와 민속 공연이 열려요.","제주시 시민복지타운광장 일대","2026"],
 [10,23,10,25,"fest","서귀포칠십리축제","거리 퍼레이드와 공연, 먹거리 장터가 있는 서귀포 대표 축제.","서귀포 천지연폭포 주차장 일대","2026"],
 [10,10,11,20,"view","억새 절정","오름 능선이 은빛 억새로 출렁여요. 해 질 녘 역광이 가장 아름답습니다.","새별오름, 따라비오름, 산굼부리, 아끈다랑쉬오름",null,"해 지기 1시간 전에 올라 역광으로 억새를 보세요. 백약이오름은 자연휴식년으로 출입이 제한돼 있으니 다른 오름을 고르세요."],
 [10,20,11,10,"view","한라산 단풍","계곡을 따라 붉게 물드는 한라산 가을.","천아계곡, 1100고지, 영실"],
 [11,5,11,7,"fest","제주올레걷기축제","사흘간 올레 코스를 함께 걷는 축제. 참가 신청은 미리 하세요.","제주올레 지정 코스","2026"],
 [11,19,11,22,"fest","최남단방어축제","방어 맨손잡기와 방어 시식, 공연이 열리는 겨울 바다 축제.","대정읍 모슬포항 일원","2026"],
 [11,19,11,23,"fest","제주감귤박람회","감귤 직거래와 가족 체험, 공연. 사전예약하면 입장료가 절반이에요.","서귀포농업기술센터 제주농업생태원","2026"],
 [11,1,12,31,"food","노지감귤 따기 체험","주렁주렁 열린 귤을 직접 따 보는 시기. 농장마다 체험비와 가져갈 수 있는 양이 달라요.","서귀포·남원·효돈 일대 감귤농장"],
 [11,20,12,18,"tip","늦가을 비수기","단풍철이 끝나고 연말 전까지 숙박 요금이 내려가는 편이에요.","제주 전역"],
 [12,20,12,31,"tip","연말 성수기","크리스마스와 연말 해맞이 여행객이 몰려 숙박·렌터카가 오릅니다.","제주 전역"]
];
const MSUB=["눈 덮인 한라산과 붉은 동백","입춘굿과 첫 매화","들불축제, 유채와 벚꽃","유채·청보리·고사리의 봄","녹차밭과 산철쭉","수국과 반딧불이, 장마","해변과 한치의 여름","해바라기와 극성수기","해녀축제와 가을 메밀","억새와 축제의 달","감귤과 방어","동백과 연말 해돋이"];
const DOW=["일","월","화","수","목","금","토"];
const now=new Date();
let year=now.getFullYear()===2026||now.getFullYear()===2027?now.getFullYear():2026;
let month=now.getMonth()+1, selDay=null;
let on={spot:true,fest:true,view:true,food:true,tip:true};
try{const s=JSON.parse(localStorage.getItem("jeju-cal-filter")||"null");if(s)on=Object.assign(on,s)}catch(e){}
const $=id=>document.getElementById(id);
function track(name,params){try{if(typeof gtag==="function")gtag("event",name,params)}catch(e){}}

function key(m,d){return m*100+d}
function covers(e,m,d){const s=key(e[0],e[1]),t=key(e[2],e[3]),k=key(m,d);return s<=t?(k>=s&&k<=t):(k>=s||k<=t)}
function inMonth(e,m){const last=new Date(2027,m,0).getDate();for(let d=1;d<=last;d++)if(covers(e,m,d))return true;return false}
function fmt(e){const a=`${e[0]}월 ${e[1]}일`,b=`${e[2]}월 ${e[3]}일`;return (e[0]===e[2]&&e[1]===e[3])?a:`${a} ~ ${b}`}
function visible(e){return on[e[4]]}

function renderMonths(){
  $("months").innerHTML="";
  for(let m=1;m<=12;m++){const b=document.createElement("button");b.textContent=m+"월";b.setAttribute("aria-pressed",m===month);b.onclick=()=>{month=m;selDay=null;render();track("view_month",{month:m})};$("months").appendChild(b)}
}
function renderFilters(){
  $("filters").innerHTML="";
  for(const c in CATS){const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",on[c]);b.innerHTML=`<i class="d-${c}"></i>${CATS[c]}`;
    b.onclick=()=>{on[c]=!on[c];track("toggle_category",{category:CATS[c],on:on[c]});try{localStorage.setItem("jeju-cal-filter",JSON.stringify(on))}catch(e){}render()};$("filters").appendChild(b)}
}
function renderGrid(){
  const g=$("grid");g.innerHTML="";
  DOW.forEach((d,i)=>{const h=document.createElement("div");h.className="dow"+(i===0?" sun":i===6?" sat":"");h.textContent=d;g.appendChild(h)});
  const first=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate();
  for(let i=0;i<first;i++){const b=document.createElement("div");b.className="cell blank";g.appendChild(b)}
  for(let d=1;d<=last;d++){
    const wd=(first+d-1)%7;
    const c=document.createElement("button");
    const isToday=now.getFullYear()===year&&now.getMonth()+1===month&&now.getDate()===d;
    c.dataset.day=d;
    c.className="cell"+(wd===0?" sun":wd===6?" sat":"")+(isToday?" today":"")+(selDay===d?" sel":"");
    const evs=E.filter(e=>visible(e)&&covers(e,month,d));
    c.setAttribute("aria-label",`${month}월 ${d}일, ${evs.length}개 항목`);
    let h=`<span class="num">${d}</span>`;
    evs.slice(0,3).forEach(e=>h+=`<span class="pill c-${e[4]}">${e[5]}</span>`);
    if(evs.length>3)h+=`<span class="more">+${evs.length-3}개</span>`;
    h+=`<span class="dots">${evs.map(e=>`<i class="d-${e[4]}"></i>`).join("")}</span>`;
    c.innerHTML=h;
    c.onclick=()=>{selDay=selDay===d?null:d;render();if(selDay)track("view_day",{month:month,day:d});$("listsec").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})};
    g.appendChild(c);
  }
}
function renderList(){
  const L=$("list");L.innerHTML="";
  let evs=E.filter(e=>visible(e)&&(selDay?covers(e,month,selDay):inMonth(e,month)));
  evs.sort((a,b)=>ORDER[a[4]]-ORDER[b[4]]||(a[0]===month?a[1]:0)-(b[0]===month?b[1]:0));
  $("ltitle").innerHTML=(selDay?`${month}월 ${selDay}일 볼거리`:`${month}월 볼거리`)+`<small>${evs.length}개</small>`;
  const cb=$("clearday");
  cb.setAttribute("aria-pressed",!selDay);
  cb.textContent=selDay?`${month}월 전체 보기`:`${month}월 전체 보는 중`;
  $("dayhint").hidden=!!selDay;
  if(!evs.length){L.innerHTML=`<p class="empty">선택한 분류에 해당하는 항목이 없어요. 위에서 분류를 켜 보세요.</p>`;return}
  L.innerHTML=evs.map(itemHTML).join("");
}
const ORDER={spot:0,fest:1,view:2,food:3,tip:4};
function dayEvents(d){return E.filter(e=>visible(e)&&covers(e,month,d)).sort((a,b)=>ORDER[a[4]]-ORDER[b[4]])}
function itemHTML(e){
  const fixed=e[8];
  const badge=fixed?(String(year)===fixed?`<span class="badge ok">${fixed} 확정 일정</span>`:`<span class="badge">${fixed}년 일정 기준 · ${year}년 날짜는 발표 후 확인</span>`):`<span class="badge">해마다 이맘때</span>`;
  return `<article class="item"><div class="top"><span class="tag c-${e[4]}">${CATS[e[4]]}</span><span class="when">${fmt(e)}</span></div><h4>${e[5]}</h4><p>${e[6]}</p>${e[9]?`<div class="best"><b>이렇게 즐기세요</b>${e[9]}</div>`:""}<span class="place">장소 · ${e[7]}</span>${badge}</article>`;
}

function render(){
  $("year").value=year;
  $("mtitle").textContent=`${year}년 ${month}월`;
  $("msub").textContent=MSUB[month-1];
  renderMonths();renderFilters();renderGrid();renderList();
}
$("prev").onclick=()=>{selDay=null;if(month===1){month=12;if(year>2026)year--}else month--;render()};
$("next").onclick=()=>{selDay=null;if(month===12){month=1;if(year<2027)year++}else month++;render()};
$("year").onchange=e=>{year=+e.target.value;selDay=null;render()};
$("clearday").onclick=()=>{if(!selDay)return;selDay=null;render()};
render();
</script>
